    <style id="record-complete-styles">
      /* PSP design tokens; filled status/contact icons: Font Awesome Free. */
      .record-complete-screen {
        --record-color-primary: #0f2f4f;
        --record-color-secondary: #4f6e91;
        --record-color-action: #0365bf;
        --record-color-action-hover: #0058aa;
        --record-color-success: #28af60;
        --record-color-surface: #ffffff;
        --record-color-page: #f4f6f8;
        --record-color-border: #e5e8ec;
        --record-color-info: #eef7ff;
        --record-space-small: 8px;
        --record-space-medium: 12px;
        --record-space-large: 16px;
        --record-space-section: 24px;
        --record-font-small: 14px;
        --record-font-medium: 18px;
        --record-font-large: 24px;
        --record-radius-card: 8px;
        --record-radius-control: 6px;
        --record-motion-fast: 200ms;
        background: var(--record-color-page);

      .record-complete-page {
        box-sizing: border-box;
        min-height: 100%;
        padding: var(--invite-runtime-top-inset) 0 calc(var(--record-space-section) + var(--mobile-safe-area-height));
        background: var(--record-color-page);
        color: var(--record-color-primary);
        font-family: var(--font-ui, -apple-system, system-ui, sans-serif);
      }
      .record-complete-summary {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 320px;
        padding: var(--record-space-section);
        box-sizing: border-box;
        text-align: center;
      }
      .record-complete-icon {
        display: block;
        width: 80px;
        height: 80px;
        margin-bottom: var(--record-space-section);
        background: var(--record-color-success);
        mask: url("./page-assets/images/c2c10f625e45e8a918a6d74a063670394ad0a5078b6dd88d92f9a5ac7cb6d612.svg") center / contain no-repeat;
      }
      .record-complete-summary h1 {
        margin: 0 0 var(--record-space-medium);
        color: var(--record-color-primary);
        font-size: var(--record-font-large);
        font-weight: 600;
        line-height: 1.4;
      }
      .record-complete-summary p {
        margin: 0;
        color: var(--record-color-secondary);
        font-size: var(--record-font-small);
        line-height: 22px;
      }
      .record-contact-card {
        margin: 0 var(--record-space-large);
        padding: var(--record-space-section) var(--record-space-large);
        border: 1px solid var(--record-color-border);
        border-radius: var(--record-radius-card);
        background: var(--record-color-surface);
        box-shadow: 0 1px 8px rgba(15,47,79,.06);
      }
      .record-contact-card h2 {
        margin: 0 0 var(--record-space-large);
        color: var(--record-color-primary);
        font-size: var(--record-font-medium);
        font-weight: 600;
        line-height: 1.4;
      }
      .record-contact-row {
        display: grid;
        grid-template-columns: 48px minmax(0,1fr) auto;
        align-items: center;
        gap: var(--record-space-medium);
      }
      .record-contact-avatar {
        display: block;
        width: 48px;
        height: 48px;
        background: var(--record-color-action);
        mask: url("./page-assets/images/784cc092947db47fc9d72c99bb44449945a7dfbe2ce73ee46017f1e2f14c27a5.svg") center / contain no-repeat;
      }
      .record-contact-copy { min-width: 0; }
      .record-contact-copy strong {
        display: block;
        color: var(--record-color-primary);
        font-size: var(--record-font-small);
        font-weight: 600;
        line-height: 22px;
        overflow-wrap: anywhere;
      }
      .record-contact-copy span {
        display: block;
        color: var(--record-color-secondary);
        font-size: 12px;
        line-height: 22px;
      }
      .record-contact-button {
        min-height: 40px;
        padding: 0 var(--record-space-medium);
        border: 1px solid var(--record-color-action);
        border-radius: var(--record-radius-control);
        background: var(--record-color-surface);
        color: var(--record-color-action);
        font: 500 var(--record-font-small)/22px var(--font-ui, -apple-system, system-ui, sans-serif);
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--record-motion-fast), color var(--record-motion-fast);
      }
      .record-contact-button:hover { background: var(--record-color-info); color: var(--record-color-action-hover); }
      .record-contact-button:active { background: var(--record-color-info); box-shadow: 0 2px 0 rgba(3,101,191,.1); }

      .record-contact-button:disabled { opacity: .5; cursor: not-allowed; }
    </style>

    <script id="patient-chat-welcome-only-script">
      (() => {
        const keepWelcomeOnly = () => {
          document.querySelectorAll('[aria-label="健康建档小程序卡片"]').forEach((card) => card.remove());
          const greeting = document.querySelector('[aria-label="助手问候消息"] .assistant-greeting-bubble');
          if (greeting && /点击卡片完成建档/.test(greeting.textContent || '')) {
            greeting.textContent = '您好，我是谭主任的健康助手，您可以在您的专属群中进行减脂相关健康咨询！';
          }
        };

        const observer = new MutationObserver(keepWelcomeOnly);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        keepWelcomeOnly();
      })();
    </script>

        const userIconAsset = './page-assets/images/0be31226bd9d48dc3e93eefa6dc6ac743ad10fe2e637d9a673054150ac4c004e.png';

        const profileIconAsset = './page-assets/images/26209942af07844b620ad63c7a79d674a5b809895d2efbe2bc1e24c235883fd7.png';

        const mountAiAssistant = (fromScenario = false) => {
          const root = document.getElementById('root');
          if (root.querySelector('#ai-assistant-layer')) return;
          const viewport = root.querySelector('[data-testid="mobile-app-viewport"]');
          if (!viewport || !root.querySelector('.assistant-chat-page')) return;
          if (!fromScenario) {
            window.dispatchEvent(new CustomEvent('patient-v17-scene-change', {detail:{scene:'my'}}));
            return;
          }

          const layer = document.createElement('section');
          layer.id = 'ai-assistant-layer';
          layer.dataset.testid = 'ai-assistant-screen';
          layer.setAttribute('aria-label', '卓睦鸟健康助手 AI 聊天');
          layer.innerHTML = `
            <header class="ai-assistant-header">
              <button class="ai-assistant-profile" type="button" aria-label="个人中心">
              </button>
              <h1>卓睦鸟健康助手</h1>

                </button>
                <span class="ai-assistant-host-divider" aria-hidden="true"></span>
                <button class="ai-assistant-host-button" type="button" aria-label="关闭 AI 助手" data-ai-assistant-close>
                  <img src="${iconAssets.close}" alt="" aria-hidden="true" />
                </button>
              </div>
            </header>
            <main class="ai-assistant-chat">
              <time class="ai-assistant-time">今天 10:23</time>
              <article class="ai-assistant-message" aria-label="AI 助手消息">
                <p>您好！我是卓睦鸟健康助手。</p>
              </article>
              <p class="ai-assistant-disclaimer">内容由AI生成</p>
            </main>
            <footer class="ai-assistant-composer">
              <label class="ai-assistant-visually-hidden" for="ai-assistant-input">请输入您的问题</label>
              <input class="ai-assistant-input" id="ai-assistant-input" type="text" placeholder="请输入您的问题..." autocomplete="off" />
            </footer>`;

          layer.querySelector('.ai-assistant-profile').style.backgroundImage = `url("${profileIconAsset}")`;

<script id="patient-scene-prompt-script">

  if (document.querySelector('.guest-modal-backdrop')) return;

  const previousInert = contents.map(node => node.inert);
  contents.forEach(node => { node.inert = true; });
  const backdrop = document.createElement('div');
  backdrop.className = 'guest-modal-backdrop';

  const confirm = backdrop.querySelector('button');
  confirm.addEventListener('click', () => {
   backdrop.remove();
   contents.forEach((node, index) => { node.inert = previousInert[index]; });
   onConfirm();
  }, { once: true });
  backdrop.addEventListener('keydown', event => {
   if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); }
   if (event.key === 'Tab') { event.preventDefault(); confirm.focus(); }

  confirm.focus({ preventScroll: true });
 };
})();

<script id="patient-prototype-version-script">
(() => {
  const switcher = document.querySelector('.prototype-version-switcher');
  const trigger = document.getElementById('prototype-version-button');
  const label = document.getElementById('prototype-version-button-label');
  const menu = document.getElementById('prototype-version-menu');
  const options = document.getElementById('prototype-version-options');
  // 每个版本的完整原型放在独立的 data-prototype-version 容器内。
  const versions = [...document.querySelectorAll('[data-prototype-version]')].sort((a, b) => b.dataset.prototypeVersion.localeCompare(a.dataset.prototypeVersion, undefined, { numeric: true }));
  const items = [];
  let activeId = versions[0]?.dataset.prototypeVersion || 'v1.8';

  function closeMenu(returnFocus = false) {
    menu.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    if (returnFocus) trigger.focus();
  }

  function selectVersion(id) {
    const selected = versions.find(panel => panel.dataset.prototypeVersion === id);
    if (!selected) return;
    activeId = id;
    versions.forEach(panel => { panel.hidden = panel !== selected; });
    const name = selected.dataset.prototypeVersionLabel || id;
    label.textContent = name;
    trigger.setAttribute('aria-label', `切换原型版本，当前为 ${name}`);
    document.body.dataset.activePrototypeVersion = id;
    items.forEach(item => {
      const current = item.dataset.versionId === id;
      item.setAttribute('aria-checked', String(current));
      item.querySelector('.prototype-version-current').textContent = current ? '当前' : '';
    });
  }

  function openMenu(last = false) {
    menu.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    const selected = items.find(item => item.dataset.versionId === activeId);
    (last ? items.at(-1) : selected || items[0])?.focus();
  }

  versions.forEach(panel => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'prototype-version-item';
    item.setAttribute('role', 'menuitemradio');
    item.dataset.versionId = panel.dataset.prototypeVersion;
    const name = document.createElement('span');
    name.textContent = panel.dataset.prototypeVersionLabel || panel.dataset.prototypeVersion;
    const current = document.createElement('span');
    current.className = 'prototype-version-current';
    item.append(name, current);
    item.addEventListener('click', () => {
      selectVersion(item.dataset.versionId);
      closeMenu(true);
    });
    options.appendChild(item);
    items.push(item);
  });

  trigger.addEventListener('click', () => menu.hidden ? openMenu() : closeMenu());
  trigger.addEventListener('keydown', event => {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      openMenu(event.key === 'ArrowUp');
    }
  });
  switcher.addEventListener('keydown', event => {
    if (menu.hidden) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      closeMenu(true);
    } else if (event.key === 'Tab') {
      closeMenu();
    } else if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      const index = items.indexOf(document.activeElement);
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1
        : (index + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[next]?.focus();
    }
  });
  document.addEventListener('click', event => {
    if (!switcher.contains(event.target)) closeMenu();
  });
  selectVersion(activeId);
})();
    </script>

(() => {

  const embedded = params.get('embedded') === '1' || params.get('host') === 'wecom-preview' || params.get('sidebarEnv');
  const partialTimeline = params.get('partial') === 'timeline';
  if (embedded) {
    document.documentElement.dataset.patientEmbedded = '1';
    window.__patientEmbeddedRecord = true;
  }
  if (partialTimeline) {
    document.documentElement.dataset.patientPartial = 'timeline';
    window.__patientPartialTimeline = true;
  }
  if (params.get('theme') === 'blue') document.documentElement.dataset.patientTheme = 'blue';
  document.title = '患者档案 · 病历时间轴';

  /* The archive host needs the same v1.8 timeline implementation as the
     patient-side "我的病历" page. Mount it directly in a shadow host so the
     surrounding archive shell can keep its own blue controls without loading
     the patient app's v1.7 scene or phone chrome. */
  if (partialTimeline) {
    let embeddedTimelineTries = 0;
    const mountEmbeddedTimeline = () => {
      embeddedTimelineTries += 1;
      if (typeof window.openPatientEventTimeline !== 'function') {
        if (embeddedTimelineTries < 160) window.setTimeout(mountEmbeddedTimeline, 50);
        return;
      }

      if (!host.parentNode) document.body.appendChild(host);
      if (!host.shadowRoot) window.openPatientEventTimeline(host);
      const shadow = host.shadowRoot;
      if (!shadow) {
        if (embeddedTimelineTries < 160) window.setTimeout(mountEmbeddedTimeline, 50);
        return;

          #ai-profile-layer { --profile-color-surface:#fff; --profile-color-background-page:#f5f7fa; --profile-color-background-soft:#f5f7fa; --project-action:#0365bf; --project-action-hover:#0058aa; --project-ink:#173c61; --project-muted:#5d7894; --project-border:#dce7f1; --project-info:#eef6ff; --timeline-line:#c5def3; --timeline-tag-ink:#1261a0; --timeline-tag-surface:#eef7ff; --timeline-tag-border:#b9d8f2; }

        shadow.appendChild(style);

    const root = document.getElementById('root');
    const upload = document.getElementById('patient-upload-version');
    if (upload) upload.hidden = true;
    if (root) root.hidden = false;
    document.body.dataset.activePrototypeVersion = 'v1.7';
    document.querySelector('.prototype-version-switcher')?.setAttribute('hidden', '');
    document.getElementById('patient-v17-scenarios')?.setAttribute('hidden', '');
    if (!sceneRequested) {
      sceneRequested = true;
      window.dispatchEvent(new CustomEvent('patient-v17-scene-change', { detail: { scene: 'my' } }));
    }
  };

  let tries = 0;
  const openTimeline = () => {
    tries += 1;
    showV17();
    if (typeof window.mountPatientV17Assistant === 'function') window.mountPatientV17Assistant(true);
    const root = document.getElementById('root');
    const assistant = root?.querySelector('#ai-assistant-layer');
    if (!assistant) {
      if (tries < 160) window.setTimeout(openTimeline, 50);
      return;
    }
    const profileButton = assistant.querySelector('.ai-assistant-profile');
    if (!assistant.querySelector('#ai-profile-layer') && profileButton) {
      profileButton.click();
      window.setTimeout(openTimeline, 50);
      return;
    }
    const profile = assistant.querySelector('#ai-profile-layer');
    if (!profile) {
      if (tries < 160) window.setTimeout(openTimeline, 50);
      return;
    }
    if (profile.querySelector('#ai-timeline-layer')) {
      if (partialTimeline) {
        profile.dataset.partialView = profile.querySelector('#ai-event-detail-layer, #ai-event-original-layer') ? 'detail' : 'timeline';
        document.documentElement.dataset.patientPartialReady = '1';
      }
      return;
    }
    const projectLayer = profile.querySelector('#ai-project-detail-layer');
    if (!projectLayer) {
      const project = profile.querySelector('.ai-service-project-card');
      if (project) project.click();
      window.setTimeout(openTimeline, 50);
      return;
    }
    const medical = [...projectLayer.querySelectorAll('button')].find(button => button.textContent.includes('我的病历'));
    if (medical) medical.click();
    if (!profile.querySelector('#ai-timeline-layer') && tries < 160) window.setTimeout(openTimeline, 50);
  };
  if (partialTimeline) {
    const partialObserver = new MutationObserver(() => {
      const profile = document.getElementById('ai-profile-layer');
      if (!profile) return;
      profile.dataset.partialView = profile.querySelector('#ai-event-detail-layer, #ai-event-original-layer') ? 'detail' : 'timeline';
      if (profile.querySelector('#ai-timeline-layer')) document.documentElement.dataset.patientPartialReady = '1';
    });
    partialObserver.observe(document.documentElement, { childList: true, subtree: true });
  }
  window.setTimeout(openTimeline, 0);
})();
</script>

</body>
</html>
