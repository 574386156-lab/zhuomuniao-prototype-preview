<!doctype html>
<html lang="zh-CN" data-page-node-id="7J8RAVUKYrN7VxRDuTOxlL">
  <head data-page-node-id="ru5XDurXXqzK95rWHRB6Ev">
    <meta charset="UTF-8" data-page-node-id="Oa5KMVYTM1DfnELWG1FCBn" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="ObBSM1N6gkWHaNGVJIdquD" />
    <title>智能体工作台 · AgentBuddy</title>
    <script src="./agentbuddy/navigation.js"></script>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#173b5f;background:#f5f8fb}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;background:#f5f8fb}
      button,input,textarea{font:inherit}
      button{cursor:pointer}
      .shell{max-width:1240px;margin:0 auto;padding:30px 28px 48px}
      .crumb{color:#7890a6;font-size:13px;margin-bottom:20px}
      .crumb b{padding:0 10px;color:#b6c2ce}
      .hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 32px;border:1px solid #dce8f2;border-radius:16px;background:linear-gradient(135deg,#eaf7ff,#fff 72%);box-shadow:0 10px 28px #2b648515}
      .hero-copy{display:flex;gap:18px;align-items:center}
      .mark{display:grid;place-items:center;width:58px;height:58px;border-radius:15px;background:#dff3ff;color:#147eae;font-size:27px}
      .eyebrow{color:#2388b8;font-size:11px;font-weight:700;letter-spacing:1.2px}
      .hero h1{margin:6px 0 8px;font-size:29px}
      .hero p{margin:0;color:#697e95}
      .stat{display:grid;place-items:center;min-width:90px;padding:12px;border-radius:14px;background:#fff;color:#24639a}
      .stat strong{font-size:28px;line-height:1}
      .stat span{font-size:12px}
      .panel{margin-top:20px;padding:25px;border:1px solid #e0e8f0;border-radius:14px;background:#fff}
      .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
      .panel h2{margin:0 0 5px;font-size:20px}
      .panel p{margin:0;color:#72849a}
      .ready{padding:7px 10px;border-radius:99px;background:#ecfaf5;color:#258568;font-size:12px;white-space:nowrap}
      .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
      .action{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px;padding:21px;border:1px solid #d9e4ef;border-radius:12px;background:#fff;color:#173b5f;text-align:left}
      .action:hover{border-color:#55a9ce;background:#f5fcff}
      .action.primary{border-color:#b9dff0;background:#f2fbff}
      .action-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#e8f6ff;color:#1680b2;font-size:20px}
      .action-copy{display:grid;gap:5px}
      .action-copy small{color:#71829a;font-size:12px}
      .arrow{color:#2684bb}
      .note{display:flex;gap:8px;margin-top:16px;padding:13px 15px;border-radius:10px;background:#eef7ff;color:#617790;font-size:12px;line-height:1.6}
      .note b{color:#2b5d86;white-space:nowrap;margin-right:6px}
      .toolbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
      .back{border:0;background:transparent;color:#4280aa;padding:0}
      .toolbar h1{margin:4px 0 7px;font-size:26px}
      .toolbar p{margin:0;color:#71839a}
      .stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 18px;padding:0;list-style:none}
      .stepper li{display:flex;align-items:center;gap:8px;color:#8092a7;font-size:13px}
      .stepper li span{display:grid;place-items:center;width:28px;height:28px;border:1px solid #cad9e5;border-radius:50%;background:#fff;flex:none}
      .stepper li.active{color:#137bad;font-weight:700}
      .stepper li.active span{border-color:#2994c7;background:#e8f7ff}
      .form-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:19px;align-items:start}
      .card{padding:24px;border:1px solid #e0e8f0;border-radius:14px;background:#fff}
      .card h2{margin:0 0 5px;font-size:18px}
      .intro{margin:0 0 20px;color:#70829b;font-size:13px}
      .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
      .field{display:grid;gap:7px;margin-bottom:17px}
      .field label{font-weight:700;font-size:13px;color:#31506f}
      .field input,.field textarea{width:100%;padding:10px 12px;border:1px solid #d5e0ea;border-radius:8px;color:#203e5e}
      .field textarea{resize:vertical;min-height:65px}
      .field.invalid label{color:#b5443f}
      .field.invalid input,.field.invalid textarea,.field.invalid .tagbox{border-color:#d87570;box-shadow:0 0 0 3px #fdebea}
      .field-error{margin-top:-2px;color:#b5443f;font-size:11px;line-height:1.5}
      .form-error{display:flex;gap:8px;align-items:flex-start;margin:0 0 18px;padding:10px 12px;border:1px solid #f0c5c2;border-radius:9px;background:#fff5f4;color:#9c433e;font-size:12px;line-height:1.6}
      .form-error b{white-space:nowrap}
      .chips{display:flex;flex-wrap:wrap;gap:8px}
      .chip{padding:8px 11px;border:1px solid #d6e2ec;border-radius:8px;background:#fff;color:#526d88;font-size:12px}
      .chip.on{border-color:#2994c7;background:#eaf8ff;color:#1178ae;font-weight:700}
      .boundary-field .chip.on,.boundary-field .tagx{border-color:#dc6660;background:#fff1f0;color:#b42318}
      .preview{position:sticky;top:20px;height:max-content}
      .preview h3{margin:0;font-size:14px}
      .quote{margin:16px 0;padding:13px;border-left:3px solid #4aa9d3;background:#f4fbff;color:#506b85;font-size:12px;line-height:1.7}
      .preview dl{display:grid;gap:12px;margin:0}
      .preview dt{color:#8a9bad;font-size:11px}
      .preview dd{margin:3px 0 0;color:#345573;font-size:12px;line-height:1.5}
      .footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #e5edf3}
      .btn{padding:10px 17px;border:1px solid #d4e0ea;border-radius:8px;background:#fff;color:#345572}
      .btn:hover{border-color:#9dc4dc}
      .btn.primary{border-color:#167fb8;background:#167fb8;color:#fff}
      .btn.primary:hover{background:#1473a5}
      .btn:disabled{border-color:#dde6ee;background:#f2f6fa;color:#a3b3c2;cursor:not-allowed}
      .btn.sm{padding:7px 12px;font-size:12px}
      .list{display:grid;gap:10px}
      .agent{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:15px;border:1px solid #dfe7ef;border-radius:11px;background:#fff;text-align:left;color:#244664}
      .agent:hover{border-color:#63afd1;background:#f7fcff}
      .avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:#e6f6ff;color:#1680b2}
      .agent small{display:block;margin-top:4px;color:#7d8fa3}
      .success{text-align:center;padding:45px 30px}
      .success .mark{margin:0 auto 17px;background:#e4f8ef;color:#218761;border-radius:50%}
      .success h1{margin:0 0 10px}
      .success p{color:#6d8196;line-height:1.7}
      .success .footer{justify-content:center;border:0}

      /* ---------- 生命周期 ---------- */
      .lifecycle{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none;flex-wrap:wrap}
      .lifecycle li{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #dde7f0;border-radius:99px;background:#fff;font-size:12px;color:#8296aa}
      .lifecycle li i{width:6px;height:6px;border-radius:50%;background:#c9d6e2;font-style:normal}
      .lifecycle li.done{color:#2b8a68;border-color:#c7e6d8;background:#f3fcf8}
      .lifecycle li.done i{background:#3aa77e}
      .lifecycle li.now{color:#1178ae;border-color:#98cfe9;background:#eaf8ff;font-weight:700}
      .lifecycle li.now i{background:#2994c7;box-shadow:0 0 0 3px #d6eefa}
      .stage-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
      .ver-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #d7e6f2;border-radius:99px;background:#f7fbfe;color:#4b6f90;font-size:12px}
      .ver-badge b{color:#1178ae}

      /* ---------- 并行跑道（三条 skill 泳道的用户可见形态）---------- */
      .rail{display:grid;gap:10px}
      .lane{padding:12px 13px;border:1px solid #e4ecf4;border-radius:10px;background:#fbfdff}
      .lane h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;font-size:12px;color:#2b4d6d}
      .lane small{display:block;font-size:11px;color:#8093a6;line-height:1.6}
      .lane .dot{width:7px;height:7px;border-radius:50%;background:#c7d5e2;flex:none}
      .lane.run{border-color:#b7e0f4;background:#f3fbff}
      .lane.run .dot{background:#2994c7;box-shadow:0 0 0 3px #d9effa}
      .lane.done{border-color:#c9e9da;background:#f5fcf8}
      .lane.done .dot{background:#3aa77e}
      .lane.wait .dot{background:#e0b964}
      .lane-bar{height:4px;margin-top:8px;border-radius:99px;background:#e8f0f7;overflow:hidden}
      .lane-bar i{display:block;height:100%;border-radius:99px;background:#4aa9d3;transition:width .45s ease}

      /* ---------- 测试台 ---------- */
      .lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:19px;align-items:start}
      .chat{display:grid;gap:14px}
      .msg{display:grid;gap:6px;max-width:94%}
      .msg.me{justify-self:end;justify-items:end}
      .bubble{padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.7}
      .msg.ai .bubble{border:1px solid #dfeaf5;background:#f4faff;color:#28496b}
      .msg.me .bubble{border:1px solid #167fb8;background:#167fb8;color:#fff}
      .meta{display:flex;align-items:center;gap:10px;font-size:11px;color:#8296aa}
      .flag{border:0;background:transparent;color:#b88328;padding:0;font-size:11px}
      .flag:hover{text-decoration:underline}
      .flag.on{color:#8a5a12;font-weight:700}
      .pool{display:grid;gap:9px;margin:0;padding:0;list-style:none}
      .bc{padding:11px 12px;border:1px solid #e6ecf3;border-left:3px solid #e0a43b;border-radius:9px;background:#fffdf8}
      .bc strong{display:block;font-size:12px;color:#3c556e}
      .bc small{display:block;margin-top:4px;color:#8798ab;font-size:11px;line-height:1.55}
      .tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#fdf2e2;color:#a5721d;font-size:10px}
      .tag.hi{background:#fdeaea;color:#b5443f}
      .counter{display:flex;align-items:baseline;gap:6px;font-size:12px;color:#7e90a4}
      .counter b{font-size:22px;color:#c07a1c}

      /* ---------- 弹层 ---------- */
      .mask{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:#0e243a66}
      .modal{width:min(540px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px;background:#fff;box-shadow:0 24px 60px #0e243a3d}
      .modal h3{margin:0 0 6px;font-size:17px}
      .modal p{margin:0 0 16px;color:#7b8ea2;font-size:12px}

      /* ---------- 版本对比 ---------- */
      .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
      .tab{padding:8px 13px;border:1px solid #dbe5ee;border-radius:99px;background:#fff;font-size:12px;color:#5b7691}
      .tab.on{border-color:#2994c7;background:#eaf8ff;color:#137bad;font-weight:700}
      .diff{display:grid;gap:8px}
      .row{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.7}
      .row.del{background:#fdf3f3;color:#93433f}
      .row.add{background:#f2fbf6;color:#2c6b52}
      .row .why{display:block;margin-top:4px;font-size:10px;color:#8c9aab}
      .conflict{display:grid;gap:10px;padding:13px;border:1px solid #f0dfc3;border-radius:10px;background:#fffdf7;margin-bottom:11px}
      .conflict .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:9px;font-size:12px}
      .conflict .vs .row{display:block;padding:9px 11px}
      .conflict .vs span{color:#a5814f;font-size:11px}
      .checkbox{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#4d6b88;line-height:1.6}

      /* ---------- 灰度 / 指标 ---------- */
      .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
      .metric{padding:14px;border:1px solid #e3ecf4;border-radius:11px;background:#fbfdff;text-align:center}
      .metric b{display:block;font-size:24px;color:#1b6f9e}
      .metric span{font-size:11px;color:#8296aa}
      .metric.ok b{color:#2b8a68}
      .metric.warn b{color:#c07a1c}
      .table{width:100%;border-collapse:collapse;font-size:12px}
      .table th,.table td{padding:9px 10px;border-bottom:1px solid #eef3f8;text-align:left}
      .table th{color:#8496aa;font-weight:600;font-size:11px}
      .table td b{color:#2c4d6d}
      @media(max-width:860px){
        .hero,.toolbar,.lab,.form-layout,.grid2,.actions{grid-template-columns:1fr;display:grid}
        .metrics{grid-template-columns:1fr}
        .stepper{grid-template-columns:1fr 1fr}
        .preview{position:static}
        .shell{padding:20px 15px 35px}
        .panel,.card{padding:18px}
      }
      .req{color:#cf4a44;margin-left:3px}
      .hint{margin-left:6px;font-weight:400;color:#90a2b4;font-size:11px}
      .suffix{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:7px;background:#eef8ff;color:#137bad;font-size:12px}
      .tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px;padding:8px 10px;border:1px solid #dfe8f1;border-radius:9px;background:#fff;min-height:42px}
      .tagbox:focus-within{border-color:#7cc0e0;box-shadow:0 0 0 3px #e8f6ff}
      .tagx{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:#eaf6ff;color:#137bad;font-size:12px}
      .tagx b{cursor:pointer;font-weight:700;opacity:.65}
      .tagx b:hover{opacity:1;color:#cf4a44}
      .tagbox input{flex:1;min-width:150px;border:0;outline:0;font-size:12.5px;color:#173b5f;background:transparent;padding:3px}
      .upload{display:grid;gap:4px;place-items:center;padding:17px;border:1.5px dashed #d3e2ee;border-radius:10px;background:#fafcfe;color:#6b829a;font-size:12.5px;cursor:pointer;text-align:center}
      .upload:hover{border-color:#6fb9db;background:#f2fbff;color:#137bad}
      .upload.dragover{border-color:#2994c7;background:#eaf8ff;color:#137bad}
      .upload small{color:#9aabbb;font-size:11px}
      .filelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
      .fileitem{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid #e2eaf1;border-radius:8px;background:#f7fafc;font-size:12px;color:#3f5c78}
      .fileitem small{color:#93a5b7;font-size:10.5px}
      .fileitem em{font-style:normal;color:#2b8a68;font-size:10.5px;background:#eafaf3;padding:1px 6px;border-radius:99px}
      .fileitem em.wait{color:#b88328;background:#fdf4e5}
      .fileitem b{cursor:pointer;color:#b9c6d3;font-weight:700}
      .fileitem b:hover{color:#cf4a44}
      .routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin:12px 0 16px}
      .route{display:grid;gap:3px;padding:10px 12px;border:1px solid #e3ecf4;border-radius:9px;background:#f8fbfe}
      .route b{font-size:12px;color:#2c5478}
      .route small{font-size:11px;color:#8496aa;line-height:1.5}
      .fixnote{margin-top:8px;padding:8px 11px;border-radius:8px;background:#f4f9fd;color:#5c7a96;font-size:11.5px;line-height:1.6}
      .tag.fix{background:#eaf6ff;color:#137bad}
      .levelcard{margin-bottom:10px;padding:13px 14px;border:1px solid #e0e9f2;border-radius:10px;background:#fbfdff}
      .levelcard.invalid{border-color:#d87570;background:#fff8f7}
      .levelhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
      .levelname{padding:4px 11px;border-radius:7px;background:#e9f5fd;color:#137bad;font-size:12px;font-weight:700}
      .levelhead small{color:#8b9daf;font-size:11px}
      .level-remove{margin-left:auto;border:0;background:transparent;color:#b9c6d3;font-size:16px;line-height:1;padding:2px 5px}
      .level-remove:hover{color:#cf4a44}
      .level-add{margin-top:2px}
      .risk-custom{margin-top:9px}
      .form-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
      .form-actions .spacer{flex:1}
    </style>
