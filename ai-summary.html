<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AI小结</title>
</head>
<body>
  <p><a id="ai-summary-entry" href="卓睦鸟患管平台-交互原型.html?standalone=ai-summary#aggregate-chat">打开AI小结</a></p>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var target = new URL('卓睦鸟患管平台-交互原型.html', location.href);
      target.searchParams.set('standalone', 'ai-summary');
      ['patient', 'doctor', 'scene', 'embedded', 'host', 'sidebarEnv'].forEach(function (key) {
        if (params.has(key)) target.searchParams.set(key, params.get(key));
      });
      target.hash = 'aggregate-chat';
      document.getElementById('ai-summary-entry').href = target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
