<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卓睦鸟患管产品原型</title>
    <link rel="stylesheet" href="shared/event-simulation.css">
    <script src="shared/event-simulation.js" data-simulation-host="launcher" defer></script>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1d3553;
        background: #f4f7fb;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(145deg, #f7faff 0%, #edf4fb 100%);
      }

      main {
        width: min(1040px, calc(100% - 48px));
        margin: 0 auto;
        padding: 88px 0;
      }

      header { margin-bottom: 36px; }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.25;
      }

      header p {
        margin: 0;
        color: #64748b;
        font-size: 16px;
      }

      .prototype-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .prototype-card {
        display: grid;
        min-height: 240px;
        padding: 30px;
        border: 1px solid #dbe5f0;
        border-radius: 14px;
        color: inherit;
        background: #fff;
        box-shadow: 0 10px 30px rgb(31 78 121 / 8%);
        text-decoration: none;
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .prototype-card:hover,
      .prototype-card:focus-visible {
        border-color: #6daee8;
        box-shadow: 0 16px 36px rgb(31 78 121 / 14%);
        transform: translateY(-3px);
        outline: none;
      }

      .prototype-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 28px;
        border-radius: 12px;
        color: #1677d2;
        background: #eaf5ff;
        font-size: 16px;
        font-weight: 700;
      }

      .prototype-card h2 {
        margin: 0 0 10px;
        font-size: 22px;
      }

      .prototype-card p {
        margin: 0;
        color: #64748b;
        line-height: 1.7;
      }

      .prototype-link {
        align-self: end;
        margin-top: 28px;
        color: #1677d2;
        font-weight: 600;
      }

      @media (max-width: 720px) {
        main { width: min(100% - 32px, 560px); padding: 56px 0; }
        .prototype-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>卓睦鸟患管产品原型</h1>
        <p>请选择需要查看的交互原型。</p>
      </header>

      <section class="prototype-grid" aria-label="原型入口">
        <a class="prototype-card" href="./卓睦鸟患管后台-交互原型.html">
          <span class="prototype-icon" aria-hidden="true">后台</span>
          <h2>卓睦鸟患管后台</h2>
          <p>查看患管后台管理交互原型。</p>
          <span class="prototype-link">进入原型 →</span>
        </a>

        <a class="prototype-card" href="./卓睦鸟患管平台-交互原型.html">
          <span class="prototype-icon" aria-hidden="true">平台</span>
          <h2>卓睦鸟患管平台</h2>
          <p>查看患管平台管理交互原型。</p>
          <span class="prototype-link">进入原型 →</span>
        </a>

        <a class="prototype-card" href="./卓睦鸟患管助手-患者端-交互原型.html">
          <span class="prototype-icon" aria-hidden="true">患者端</span>
          <h2>卓睦鸟患管助手-患者端</h2>
          <p>查看卓睦鸟患管助手患者端交互原型。</p>
          <span class="prototype-link">进入原型 →</span>
        </a>
        <a class="prototype-card" href="./wecom-plugin.html">
          <span class="prototype-icon" aria-hidden="true">企微</span>
          <h2>企微插件</h2>
          <p>手机预览：消息列表、1v1 对话，以及快捷回复、患者跟进、患者档案。</p>
          <span class="prototype-link">进入原型 →</span>
        </a>
        <section class="prototype-event-card" aria-labelledby="simulation-title">
          <span class="prototype-icon" aria-hidden="true">事件</span>
          <div class="prototype-event-copy"><h2 id="simulation-title">事件模拟</h2><p>模拟患者转接，查看聚合聊天接待提醒。</p><p class="prototype-event-status" id="transfer-simulation-status" role="status" aria-live="polite"></p></div>
          <div class="prototype-event-actions"><button type="button" data-simulate-transfer>转接模拟</button><button type="button" data-replay-transfer-sound hidden>重播提示音</button></div>
        </section>
      </section>
    </main>
  </body>
</html>
